name: Package checks (no GPU)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify matrix, bundled hashes and Python/notebook syntax
        run: python DGX_B200_ONLINE/test_package.py
      - name: Validate notebook schemas
        run: |
          python -m pip install 'nbformat>=5.10,<6'
          python - <<'PY'
          from pathlib import Path
          import nbformat
          for path in Path('DGX_B200_ONLINE').glob('*.ipynb'):
              nbformat.validate(nbformat.read(path, as_version=4))
          PY
